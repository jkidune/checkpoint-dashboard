          # ── Backend: FY2026 fine is one-time 15%, never monthly compounding ──
          rules_path = 'backend/routes/rules.js'
          fine_function = r'''function calculateFine(rules, contributionAmount, monthsLate, month, year, fy) {
  if (!rules.late_fine_enabled || monthsLate <= 0) return null;

  const type = rules.late_fine_type || 'percentage';

  if (type === 'flat') {
    return {
      amount: rules.late_fine_flat_amount || 3500,
      reason: `Late contribution ${month}/${year} — one-time flat fine TZS ${(rules.late_fine_flat_amount || 3500).toLocaleString()} (FY${fy})`,
    };
  }

  // Percentage fines are assessed ONCE per contribution month after its deadline.
  // They do not compound as additional calendar months pass. Example: FY2026
  // monthly contribution TZS 75,000 × 15% = TZS 11,250, whether it is 1 or 5
  // months late. A different missed contribution month receives its own fine.
  const fineAmount = Math.round(contributionAmount * rules.late_fine_rate);
  return {
    amount: fineAmount,
    reason: `Late contribution ${month}/${year} — one-time ${Math.round(rules.late_fine_rate * 100)}% fine (FY${fy})`,
  };
}'''
          regex_once(
