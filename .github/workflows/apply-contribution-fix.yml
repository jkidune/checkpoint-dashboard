          new_auto_fine = r'''  // Auto-generate a fine only when this contribution month has never been fined.
  // A fine is one assessment per missed/late month; recording the contribution later
  // must not create a second fine for the same contribution period.
  if (rules.late_fine_enabled && status === 'paid') {
